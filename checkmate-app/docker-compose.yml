version: '3.8'

services:
  checkmate-app:
    image: ghcr.io/adedayo/checkmate-app:latest
    container_name: checkmate-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - checkmate-data:/root/.checkmate
    environment:
      - PORT=8080

volumes:
  checkmate-data:
    name: checkmate-data
