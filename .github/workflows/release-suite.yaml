name: Release Checkmate Suite

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Suite with Submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # We check out the submodules exactly at the commit the suite specifies.

      - name: Tag Library Dependencies
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MODULES=("checkmate-core" "checkmate-plugin" "checkmate-badger-project-manager" "git-service-driver" "ldap-sync")
          
          for mod in "${MODULES[@]}"; do
            echo "Tagging $mod with $TAG..."
            cd "$mod"
            # Tag the current HEAD of the submodule
            git tag "$TAG" || true
            # Push the tag to its origin remote (GitHub)
            git push origin "$TAG" || true
            cd ..
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Authenticate to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u USERNAME --password-stdin

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          install-only: true

      - name: Run GoReleaser (Checkmate)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
        # We run goreleaser inside the checkmate submodule
        working-directory: ./checkmate
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            goreleaser release --snapshot --skip publish --clean
          else
            goreleaser release --clean
          fi
